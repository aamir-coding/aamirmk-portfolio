<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#27272a" stroke-width="2" rx="8"/>

  <!-- Editorial Top Eyebrow -->
  <g transform="translate(80, 100)">
    <rect width="180" height="32" fill="#27272a" rx="4"/>
    <text x="90" y="21" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">VERIFIED DOSSIER</text>
    <text x="200" y="21" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#71717a">REF: AMK-PORTFOLIO-2026</text>
  </g>

  <!-- Candidate Identity Headline -->
  <text x="80" y="220" font-family="'Newsreader', 'Georgia', serif" font-size="64" font-weight="700" fill="#f4f4f5" letter-spacing="-0.5">Aamir Mohammed Khan</text>
  <text x="80" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#3b82f6">AI Systems &amp; Full-Stack Engineer</text>

  <!-- Credentials Ribbon -->
  <g transform="translate(80, 320)">
