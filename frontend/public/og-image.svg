  <g transform="translate(80, 430)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#71717a" letter-spacing="1">SYSTEM ARCHITECTURES &amp; CORE STACK</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#e4e4e7">FastAPI • Starlette SSE • Hybrid RAG (BM25 + ONNX) • Groq • React 19 • TypeScript • Redis</text>
  </g>

