name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check --config backend/pyproject.toml backend evals

      - name: Run Ruff formatter check
        run: ruff format --check --config backend/pyproject.toml backend evals

      - name: Provision embedding assets before offline runtime tests
        run: >-
          python -c "from fastembed import TextEmbedding;
          TextEmbedding(model_name='BAAI/bge-small-en-v1.5', threads=1)"

      - name: Run pytest test suite
        run: |
          python -m pytest -c backend/pyproject.toml backend/tests evals -v

      - name: Verify release assets without regenerating the index
        working-directory: backend
        env:
          RENDER_GIT_COMMIT: ${{ github.sha }}
        run: python -m app.release

      - name: Offline retrieval, replay and compatible baseline gate
        run: python -m evals.run --full --output build/evals/results.json

      - name: Preserve actual offline results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval-results
          path: build/evals/results.json
          if-no-files-found: warn

  frontend:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript build verification
        run: |
          cd frontend
          npm run build

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm test

      - name: Enforce initial JavaScript gzip budget
        run: node frontend/scripts/check-bundle.mjs

      - name: Audit frontend dependencies without automatic fixes
        working-directory: frontend
        run: npm audit --audit-level=high
