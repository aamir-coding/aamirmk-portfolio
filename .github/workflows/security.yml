name: Security audits
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the application's pinned development requirements
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Freeze the resolved environment and isolate the audit tool
        run: |
          mkdir -p build
          python -m pip freeze > build/python-environment.txt
          python -m venv "$RUNNER_TEMP/portfolio-audit"
          "$RUNNER_TEMP/portfolio-audit/bin/python" -m pip install pip-audit==2.10.1
      - name: Audit the complete resolved Python graph
        run: >-
          "$RUNNER_TEMP/portfolio-audit/bin/python" -m pip_audit
          --disable-pip --no-deps -r build/python-environment.txt
          --format json --output build/pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-audit
          path: build/pip-audit.json
          if-no-files-found: warn
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
