services:
  - type: web
    name: portfolio-assistant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from app.retrieval.dense import ensure_model_cached; ensure_model_cached()" && python -m app.release
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers --no-access-log --ws none --log-config logging.json
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: AUTO_AUTHORIZE_INFERENCE
        value: "true"
      - key: INFERENCE_SHARED_LIMITS
        value: '{"rpm":24,"tpm":20000,"rpd":800,"tpd":160000}'
      - key: INFERENCE_MODEL_LIMITS
        value: '{"openai/gpt-oss-120b":{"rpm":24,"tpm":20000,"rpd":800,"tpd":160000},"openai/gpt-oss-20b":{"rpm":24,"tpm":20000,"rpd":800,"tpd":160000}}'
      - key: FASTEMBED_CACHE_PATH
        value: .cache/fastembed
      - key: CORS_ORIGINS
        sync: false
