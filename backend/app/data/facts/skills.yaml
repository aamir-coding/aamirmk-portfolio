chunks:

  # ---------- AI-Assisted Development ----------
  - id: skill-ai-assisted-dev
    type: skill
    title: "AI-Assisted Development Tools"
    source_section: "S5, A4, J15"
    tags: ["ai-tools", "development-workflow", "claude", "copilot", "chatgpt", "gemini", "antigravity"]
    draft: true
    private: false
    content: |
      Aamir uses the following AI coding assistants in his development workflow: Claude, Claude Code, GitHub Copilot, ChatGPT, Gemini, and Antigravity. He has NOT used Cursor — do not list it.

      Typical AI-assisted tasks include exploring unfamiliar codebases, implementing features, debugging, generating tests, refactoring, and reviewing code alternatives. His workflow principle is to use agents to accelerate work while inspecting changes, understanding the approach, running the application and relevant tests, reproducing bugs, and verifying results before accepting a change.

      Aamir does not treat AI output as automatically correct. He inspects diffs, reasons about the approach, runs code, reproduces failures, checks edge cases and security, and consults documentation when uncertain. He remains responsible for understanding and validating what ships. He does not claim that he independently understands every generated line by default; he keeps working until he can explain and verify the code relevant to a feature.

      The AI Digital Assistant portfolio project is being developed with help from AI coding agents. Aamir's role involves setting requirements, steering implementation, reviewing generated changes, debugging integrations, and verifying actual behaviour.

  # ---------- AI/LLM Engineering ----------
  - id: skill-ai-llm-engineering
    type: skill
    title: "AI/LLM Engineering Skills"
    source_section: "A1, A2, A3, A5"
    tags: ["rag", "embeddings", "tool-calling", "prompt-injection", "evaluations", "llm"]
    draft: true
    private: false
    content: |
      Aamir's AI/LLM engineering skill levels (honestly assessed):

      - RAG: learning/working. Currently preparing the portfolio knowledge base and retrieval workflow. Not production-expert level.
      - Embeddings: learning/working. Intended as part of hybrid retrieval for the portfolio assistant. Embedding model and evaluation details are pending.
      - Tool calling: working exposure through LLM application design in Entropy-OJ and the portfolio assistant plan. Exact tools currently shipped must be verified.
      - Prompt-injection defence: working/learning. Defensive design is part of the assistant plan. Concrete controls should be described only if implemented and tested.
      - Evaluations: learning/working. The assistant needs a labelled retrieval/answer question set. Entropy-OJ has test files/output handling, but comprehensive LLM evals with results are not claimed.
      - Fine-tuning: no hands-on evidence available.
      - Agents: learning/working exposure to coding agents and tool-calling workflows. Using an AI coding agent is not the same as having built a general-purpose autonomous-agent system.

      Entropy-OJ documents three AI workflows: (1) Socratic Debug Copilot with progressive hints and code-block stripping, (2) AI Problem-Setting QA Auditor for reviewing problem statements and judge packages, and (3) Post-acceptance approach/complexity classifier as an asynchronous background job. These use Gemini Flash, Groq, and OpenRouter as providers with a fallback design. Verified evaluation pass rates are not known.

      Aamir distinguishes a full-stack AI engineer (building the product around AI: UI, backend, APIs, retrieval, tool calling, evaluation, safety, deployment) from an ML engineer (data pipelines, model training/evaluation, serving). He is primarily aiming toward full-stack AI/software engineering.

