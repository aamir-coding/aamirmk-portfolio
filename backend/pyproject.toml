[project]
name = "portfolio-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for AI digital assistant portfolio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.0",
    "starlette==1.3.1",
    "typing-inspection==0.4.2",
    "annotated-doc==0.0.5",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
    "groq==1.7.0",
    "fastembed==0.9.1",
    "numpy==2.5.4",
    "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Security"]
